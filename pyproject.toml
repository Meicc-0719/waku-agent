[project]
name = "waku-agent"
# 唯一版本来源为 waku/__init__.py。此前 pyproject 与包版本在四次发布中不一致
# （此处为 0.1.4，包中为 0.1.0），因为没有机制强制二者匹配。现在只需更新一个版本号。
dynamic = ["version"]
description = "A minimal, transparent, local-first Waku: harness + loop + memory + eval, in code you can read in an afternoon."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sean Chen (ShenSeanChen)" }]
requires-python = ">=3.11"
keywords = ["ai-agent", "llm", "agent-framework", "local-first", "llmops", "memory", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",   # Anthropic 协议格式：Anthropic、Kimi、GLM、MiniMax
    "openai>=1.50",      # OpenAI 协议格式：OpenAI、Gemini、DeepSeek（以及嵌入）
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/ShenSeanChen/waku-agent"
Repository = "https://github.com/ShenSeanChen/waku-agent"
Issues = "https://github.com/ShenSeanChen/waku-agent/issues"
Changelog = "https://github.com/ShenSeanChen/waku-agent/releases"

[project.scripts]
# 品牌化 CLI：`waku dashboard`、`waku voice`、用于对话的 `waku` 等。
waku = "waku.__main__:main"

[project.optional-dependencies]
# 评测支柱：LLM 评审（确定性评测仅需 pytest）。
eval = [
    "pytest>=8.0",
    "deepeval>=2.0",
]
# LLM 运维支柱：本地追踪仪表盘（追踪记录也始终写入 traces/*.jsonl）。
tracing = [
    "arize-phoenix>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# 可选渠道：通过手机向本机发送消息。
telegram = [
    "python-telegram-bot>=21.0",
]
# create_event 的可选直写目标；本地 SQLite/ICS 模拟仍是默认值和事实来源。
gcal = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
    "httplib2>=0.22",
    # 浏览器授权流程。没有它只能使用 `gcloud auth application-default login`，
    # 这是一套开发者流程，而不是普通登录。
    "google-auth-oauthlib>=1.0",
]
# 可选渠道：通过 Discord 向 Waku 发送消息。
discord = [
    "discord.py>=2.4",
]
# 可选渠道：通过 Meta Cloud API 使用 WhatsApp（需要公开 URL，见 docstring）。
whatsapp = [
    "httpx>=0.25",
]
# 可选渠道：与本机语音交谈。TTS 默认使用 macOS `say`；若需神经英式语音，
# 请安装 kokoro 和 soundfile（会拉取 torch）。
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    # gateway/voice.py 直接导入 numpy（音频缓冲区）。它目前恰好随 faster-whisper
    # 安装，但依赖传递依赖会在上游发布时出问题，因此应显式声明实际导入的包。
    "numpy>=1.24",
]
# 高质量神经语音（Kokoro-82M，Apache-2.0）：英式管家音色，完全本地/离线。体积较大，
# 会拉取约 2GB 的 torch。执行 `uv pip install '.[voice-neural]'` 后 Waku 自动检测，
# 无需环境变量。
voice-neural = [
    "kokoro>=0.9",
    "soundfile>=0.12",
]
# 可选语义记忆升级路径：Supabase pgvector（见 launch-rag）。
supabase = [
    "supabase>=2.0",
]
# 记忆竞技场：让托管记忆后端与 Waku 自身 FTS5 存储竞速。默认永不安装——核心仅依赖
# 标准库与 anthropic/openai，这些依赖只为 `make arena` 提供基准测试。
arena = [
    "mem0ai>=2.0",
    "zep-cloud>=2.0",
    "langmem>=0.0.30",
    "langgraph>=0.3",
]
# 可选情景记忆后端：Notion 数据库。
# 要求 >=2.5：适配器使用 data_sources API（Notion API 2025-09-03）。
notion = [
    "notion-client>=2.5",
]
# 可选：连接 MCP 服务器（.waku/mcp.json）。
# 需要 >=2.1：Streamable HTTP 传输层为 `streamable_http_client`，接收预先创建的 httpx
# 客户端。1.x 将其拼写为 `streamablehttp_client`，直接接收 headers 且产生第三个元素，
# 因此 mcp_client.py 的远程分支无法在 1.x 工作；未固定最低版本会在导入时失败。
mcp = [
    "mcp>=2.1",
]
dev = [
    "pytest>=8.0",
    # 精确固定：未固定的 linter 可能使每次 ruff 发布都在零代码变更下令 CI 失败
    # （2026-07-24 的 0.16.0 新增规则，一夜间出现 106 项违规）。请有意地升级。
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# sdist 应仅包含构建和测试 Waku 所需内容：源码、内置技能、架构和评测。未经排除时它有
# 2.6 MB，其中 2.5 MB 是白板 PNG、.excalidraw 源文件和只在此仓库内有用的代理工具
# （.claude、.agents、.pi）。这些内容均保留在 GitHub 供人阅读，不应进入包下载。
[tool.hatch.version]
path = "waku/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "docs", "examples",
    ".claude", ".agents", ".pi", ".deepeval", ".github",
]

[tool.hatch.build.targets.wheel]
packages = ["waku"]

# 内置技能存放在仓库根目录，因为贡献者在此添加它们（CONTRIBUTING.md、CI 的
# validate-skills 任务、`skills/community/`）。但 `packages = ["waku"]` 只会发布包本身，
# 因此在 2026-07-31 前，`pip install waku-agent` 得到的包没有任何技能——四大支柱之一的
# 程序性记忆会静默缺失，而仪表盘仍可正常发布（它位于 waku/ops/static）。构建时复制技能
# 既保留单一的贡献入口，也确保技能随包发布；waku.memory.bundled_skill_dirs() 会在两处查找并说明原因。
[tool.hatch.build.targets.wheel.force-include]
"skills" = "waku/skills"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Waku 有意忽略的规则——每一项都是刻意的风格选择，不是疏漏。若想移除某项，请先阅读原因：
ignore = [
    "BLE001",  # 不加筛选的 `except Exception` 是已记录模式：工具和观察器将错误作为文本呈现，
               # 而不让循环崩溃。
    "DTZ001", "DTZ005", "DTZ011",  # 朴素本地日期时间是有意为之：每日追踪文件和工作区文件夹
               # 使用用户本地日期命名，而非 UTC。
    "S110",    # 对可选集成（OTel、额外依赖）使用 try/except/pass。
    # RUF100 会标记已不再启用规则的 `# noqa`。由于上述规则被全局忽略，贡献者写下的任意
    # `# noqa: BLE001`（放在宽泛 `except Exception` 旁自然且正确的写法）都会让他们未修改的
    # 文件在 CI 中失败。这个陷阱在 2026-07-26 阻塞了两个社区 PR（#14、#26）。关闭 RUF100
    # 会失去发现真正过期 noqa 的能力；保留它则会让贡献者面对无法解释的失败 CI。应优先贡献者体验。
    "RUF100",
]
