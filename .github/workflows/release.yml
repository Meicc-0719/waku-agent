# 发布曾是需要人工记住的步骤，并且曾两次遗漏：v0.1.3 和 v0.1.4 虽已打标签、完成构建，
# 却从未上传。因此 `pip install waku-agent` 仍安装 0.1.1，而 main 已领先 67 个提交。
# 单靠规则无法解决问题，因为规则只是提醒，而失效的正是提醒本身。
#
# 因此，标签即发布：推送 v0.1.6 即会触发发布。
#
# 不保存任何 Token：PyPI Trusted Publishing 通过 OIDC 验证发起请求的是哪个仓库的
# 哪个工作流。下方的 `id-token: write` 即用于此目的，因此无需泄露或轮换密钥。
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC — how PyPI knows this workflow is really us
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 标签是人工输入两次版本号。若两者不一致，标签和构建产物代表的版本不同，
      # 而 PyPI 以构建产物为准；因此在此终止，避免发布从未打过标签的版本。
      - name: The tag must be the version in waku/__init__.py
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.*?)\"', pathlib.Path('waku/__init__.py').read_text()).group(1))")
          echo "tag=$tag  package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $pkg — nothing published."
            exit 1
          fi

      # 保护 main 的质量门同样保护发布。发布是此处唯一不可撤销的操作：即使删除后，
      # PyPI 也不允许重新上传同一版本。
      - name: Install
        run: pip install -e '.[dev]'
      - name: Deterministic evals
        run: python -m pytest -q evals/deterministic

      - name: Build
        run: pipx run build
      - name: Check the artifacts
        run: pipx run twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
