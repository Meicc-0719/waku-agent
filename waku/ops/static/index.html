<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waku わく</title>
<link rel="icon" type="image/svg+xml" href="/static/waku-mark.svg">
<link rel="stylesheet" href="/static/style.css"></head><body>
<nav id="nav">
  <div class="brand"><i class="mark" aria-hidden="true"></i>Waku わく<small id="model" style="cursor:pointer" title="点击更换模型" onclick="location.hash='#models'"></small>
    <button id="nav-toggle" title="隐藏侧边栏">&#10094;</button></div>
  <div class="grp">系统</div>
  <a href="#overview" data-v="overview">概览</a>
  <a href="#gateway" data-v="gateway">渠道 <span class="n" id="n-gw"></span></a>
  <a href="#loop" data-v="loop">循环 <span class="n" id="n-loop"></span></a>
  <a href="#graph" data-v="graph">图工作流 <span class="n" id="n-graph"></span></a>
  <a href="#memory" data-v="memory">记忆 <span class="n" id="n-mem"></span></a>
  <a href="#tools" data-v="tools">工具 <span class="n" id="n-tools"></span></a>
  <a href="#database" data-v="database">数据库 <span class="n" id="n-db"></span></a>
  <a href="#ops" data-v="ops">运维 <span class="n" id="n-ops"></span></a>
  <!-- Arena gets its own section. It was one row under System with the two
       races behind sub-tabs, on the reasoning that "Models" must not appear
       twice in the nav. It appears twice now, on purpose, because the two
       things are not the same word: SETUP > Models picks the model your agent
       USES, and ARENA > Model race puts ten of them through the loop and
       scores them. "race" carries that difference in one syllable, and hiding
       a whole half of the page behind a sub-tab cost more than the repetition
       ever did. -->
  <div class="grp">竞技场</div>
  <a href="#compare/models" data-v="compare" data-sub="models">模型竞速</a>
  <a href="#compare/memory" data-v="compare" data-sub="memory">记忆竞速</a>
  <div class="grp">设置</div>
  <a href="#models" data-v="models">模型</a>
  <a href="#connections" data-v="connections">连接</a>
  <a href="#settings" data-v="settings">行为</a>
</nav>
<div class="resizer" id="nav-resizer" title="Drag to resize sidebar"></div>
<main>
  <header class="pagehead">
    <h1 id="title">概览</h1>
    <div class="sub" id="sub"></div>
  </header>
  <div id="view"></div>
</main>
<div class="resizer" id="dock-resizer" title="Drag to resize chat"></div>
<aside id="dock">
  <div class="dockhead">
    <span class="dt">对话</span>
    <span class="arch-status"></span>
    <button id="dock-close" title="收起对话">&rsaquo;</button>
  </div>
  <div class="sesshead" style="padding:8px 2px 0">
    <button class="sessbtn" onclick="newChat()">+ 新建对话</button>
    <button class="sessbtn" onclick="toggleSessMenu(event)">历史记录 &#9662;</button>
    <button class="sessbtn teletoggle" id="teletoggle" onclick="toggleTele()" title="显示/隐藏每轮统计：检索决策、耗时、迭代次数和工具">统计</button>
    <button class="modelchip" id="modelchip" onclick="toggleModelMenu(event)" title="切换本次对话的模型">&hellip;</button>
  </div>
  <div class="chatlog" id="docklog"></div>
  <div class="chatbar">
    <input id="dmsg" placeholder="向 Waku 发送消息&hellip;" autocomplete="off">
    <button id="mic" title="点击说话：本地 Whisper，不上传云端"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="dsend">发送</button>
  </div>
</aside>
<button id="nav-reopen" title="显示侧边栏">&#9776;</button>
<button id="dock-reopen" title="打开对话">&lsaquo; 对话</button>
<!-- Frontend is split into focused classic scripts sharing one global scope
     (no build step, no modules). Order matters only in that main.js runs the
     bootstrap and must load LAST. See static/README.md for the file map. -->
<script src="/static/js/util.js"></script>
<script src="/static/js/memory.js"></script>
<script src="/static/js/models.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/diagram.js"></script>
<script src="/static/js/graph.js"></script>
<script src="/static/js/views.js"></script>
<script src="/static/js/compare.js"></script>
<script src="/static/js/dock.js"></script>
<script src="/static/js/main.js"></script></body></html>
